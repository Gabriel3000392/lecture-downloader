[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-downloader"
version = "0.1.0"
description = "Find Echo360 lecture media IDs from an authenticated section page."
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0",
    "playwright>=1.44",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
lecture-downloader = "lecture_downloader.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
